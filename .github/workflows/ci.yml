name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: No media or private mirrors in the repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject committed media
        run: |
          if git ls-files | grep -iE '\.(mp4|mov|mkv|m4a|wav|mp3|webm)$'; then
            echo "::error::Media files must not be committed. Tests generate their media at run time."
            exit 1
          fi
      - name: Reject private package mirror URLs
        run: |
          if git grep -nI -E 'https?://[^ ]*(packagefeed|pkgs\.dev\.azure\.com|artifactory)' -- . ':!.github'; then
            echo "::error::A private package mirror URL is committed. Use the public PyPI index."
            exit 1
          fi
          echo "clean"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
        include:
          # Ubuntu 24.04 LTS ships ffmpeg 6.1, which takes rostrum's older filter-script path.
          - os: ubuntu-24.04
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tools
        run: |
          ffmpeg -hide_banner -version
          rostrum --version
      - name: Test
        run: python -m pytest -q
